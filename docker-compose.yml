version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15.8-alpine
    container_name: ekg_postgres
    environment:
      POSTGRES_DB: ekg_learning
      POSTGRES_USER: ekg_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - ekg_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ekg_user -d ekg_learning"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI 后端
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ekg_backend
    environment:
      - DATABASE_URL=postgresql://ekg_user:${POSTGRES_PASSWORD}@postgres:5432/ekg_learning
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=true
      - LOG_LEVEL=info
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - upload_data:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ekg_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # React 前端
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: ekg_frontend
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000/ws
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - ekg_network
    command: npm run dev -- --host 0.0.0.0

  # Nginx 反向代理（生产环境）
  nginx:
    image: nginx:1.27-alpine
    container_name: ekg_nginx
    profiles:
      - production
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    networks:
      - ekg_network

networks:
  ekg_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  upload_data:
    driver: local
